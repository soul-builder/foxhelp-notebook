  <script>
    // Libraries
    const { jsPDF } = window.jspdf || {};
    const JSZip = window.JSZip;

    // Elements
    const sidebar = document.getElementById('sidebar');
    const toggleSidebar = document.getElementById('toggleSidebar');
    const noteList = document.getElementById('noteList');
    const noteTitle = document.getElementById('noteTitle');
    const notepad = document.getElementById('notepad');
    const newNote = document.getElementById('newNote');
    const saveNote = document.getElementById('saveNote');
    const deleteNote = document.getElementById('deleteNote');
  const statusEl = document.getElementById('status');
  const wordCountEl = document.getElementById('wordCount');
  const charCount = document.getElementById('charCount');
    const search = document.getElementById('search');
    const openFileBtn = document.getElementById('openFileBtn');
  const openFile = document.getElementById('openFile');
  const exportAllBtn = document.getElementById('exportAllBtn');
  const exportBtn = document.getElementById('exportBtn');
  const exportMenu = document.getElementById('exportMenu');
  const exportPdfOption = document.getElementById('exportPdfOption');
  const exportTxtOption = document.getElementById('exportTxtOption');

    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const clearNoteBtn = document.getElementById('clearNote');
    const fontFamily = document.getElementById('fontFamily');
    const fontSize = document.getElementById('fontSize');
  const findReplaceBtn = document.getElementById('findReplaceBtn');
  const findReplacePanel = document.getElementById('findReplacePanel');
    const findInput = document.getElementById('findInput');
    const replaceInput = document.getElementById('replaceInput');
    const doFind = document.getElementById('doFind');
    const doReplace = document.getElementById('doReplace');
    const doReplaceAll = document.getElementById('doReplaceAll');
    const closeFind = document.getElementById('closeFind');

    const cutBtn = document.getElementById('cutBtn');
    const copyBtn = document.getElementById('copyBtn');
    const pasteBtn = document.getElementById('pasteBtn');
    const printBtn = document.getElementById('printBtn');
    const darkToggle = document.getElementById('darkToggle');
  // legacy exportPdf element removed; using exportBtn/exportMenu instead
    const insertBtn = document.getElementById('insertBtn');
    const insertMenu = document.getElementById('insertMenu');
  const specialGrid = document.getElementById('specialGrid');

    // Ensure the insert menu is appended to document.body so it won't be clipped
    // by container stacking contexts (move it at runtime to avoid changing HTML structure).
    if(insertMenu && insertMenu.parentNode !== document.body){
      try{
        document.body.appendChild(insertMenu);
        insertMenu.style.position = 'fixed';
        insertMenu.style.zIndex = '2147483647';
      }catch(e){ /* ignore */ }
    }

    // Data
    let notes = JSON.parse(localStorage.getItem('foxhelp_notes') || '[]');
    let currentId = null;
    let lastFindIndex = -1;

    // Utils
    function saveToLocal(){ localStorage.setItem('foxhelp_notes', JSON.stringify(notes)); }
    function uid(){ return 'n_' + Math.random().toString(36).slice(2,9); }
    function safeFileName(s){ return (s || 'note').replace(/[^a-z0-9\-\_ ]/gi,'').slice(0,120) || 'note'; }

    // Rendering
    function renderNotes(filter=''){
      noteList.innerHTML = '';
      const q = (filter||'').toLowerCase();
      const list = notes.filter(n => !q || (n.title + ' ' + (n.content||'')).toLowerCase().includes(q));
      if(list.length === 0){
        const empty = document.createElement('div'); empty.textContent = 'No notes yet'; empty.style.color='#666'; empty.style.textAlign='center'; noteList.appendChild(empty); return;
      }
      list.forEach(n => {
        const item = document.createElement('div'); item.className='note-item';
        const left = document.createElement('div'); left.style.flex='1';
        const t = document.createElement('div'); t.textContent = n.title || 'Untitled'; t.style.fontWeight='600';
        const m = document.createElement('div'); m.className='meta'; m.textContent = (n.content||'').slice(0,80);
        left.appendChild(t); left.appendChild(m);
        const right = document.createElement('div');
  const openBtn = document.createElement('button'); openBtn.className='btn small'; openBtn.textContent='Open'; openBtn.addEventListener('click',(e)=>{ e.stopPropagation(); loadNote(n.id); hideSidebar(); });
        
        const delBtn = document.createElement('button'); delBtn.className='btn small'; delBtn.textContent='Delete'; delBtn.addEventListener('click',(e)=>{ e.stopPropagation(); notes = notes.filter(x=>x.id!==n.id); saveToLocal(); renderNotes(search.value); });
        right.appendChild(openBtn); right.appendChild(delBtn);
        item.appendChild(left); item.appendChild(right);
        noteList.appendChild(item);
      });
    }

    // New / Save / Load
    function newNoteHandler(){
      currentId = null; noteTitle.value = ''; notepad.value = ''; status('New note'); updateCount();
    }
    function saveNoteHandler(){
      const t = noteTitle.value.trim() || 'Untitled'; const c = notepad.value;
      if(currentId){ const idx = notes.findIndex(n=>n.id===currentId); if(idx!==-1){ notes[idx].title=t; notes[idx].content=c; notes[idx].updated = new Date().toISOString(); } else { notes.unshift({id:currentId||uid(), title:t, content:c, updated:new Date().toISOString()}); } }
      else { const id = uid(); notes.unshift({id, title:t, content:c, updated:new Date().toISOString()}); currentId = id; }
      saveToLocal(); renderNotes(search.value); status('Saved'); updateCount();
    }
    function loadNote(id){ const n = notes.find(x=>x.id===id); if(!n) return; currentId = n.id; noteTitle.value = n.title; notepad.value = n.content; status('Loaded'); updateCount(); }

    // Open file
    // Wire up Open button -> hidden file input
    if(openFileBtn && openFile){
      openFileBtn.addEventListener('click', ()=> openFile.click());
    }
    if(openFile){
      openFile.addEventListener('change', async (e)=>{
        const f = e.target.files && e.target.files[0]; if(!f) return; const txt = await f.text(); noteTitle.value = f.name.replace(/\.[^.]+$/, ''); notepad.value = txt; currentId = null; status('File opened'); updateCount(); openFile.value = '';
      });
    }

    // Export menu toggle and hide-on-outside-click
    if(exportBtn && exportMenu){
      exportBtn.addEventListener('click', (e)=>{ e.stopPropagation(); exportMenu.style.display = exportMenu.style.display==='block' ? 'none' : 'block'; });
      document.addEventListener('click', (e)=>{ if(exportMenu.style.display==='block' && !exportMenu.contains(e.target) && !exportBtn.contains(e.target)){ exportMenu.style.display='none'; } });
    }

    // Export PDF using a text-based (vector) approach for crisp, selectable text and correct pagination
    function exportSinglePdf(){
      try{ if(exportMenu) exportMenu.style.display = 'none'; }catch(e){}
      try{
        if(!jsPDF){ alert('PDF export library not loaded. Make sure you are online.'); return; }

        const title = (noteTitle.value || (currentId ? (notes.find(n=>n.id===currentId)||{}).title : 'Untitled')) || 'Untitled';
        const content = notepad.value || (currentId ? (notes.find(n=>n.id===currentId)||{}).content : '') || '';

        const doc = new jsPDF({unit:'pt', format:'a4'});
        const margin = 40;
        const leftX = margin + 12; // safety offset to avoid clipping at left edge
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const usableWidth = pageWidth - margin*2 - 12; // match leftX

        const fam = (fontFamily.value || '').toLowerCase();
        let jsFont = 'helvetica';
        if(fam.includes('courier') || fam.includes('mono')) jsFont = 'courier';
        else if(fam.includes('times') || fam.includes('serif')) jsFont = 'times';

        // Body font size (consistent across pages)
        const bodyFontPt = parseInt(fontSize.value || '12', 10) || 12;
        const titleFontPt = bodyFontPt + 4; // title 4 pts larger
        const lineHeight = Math.round(bodyFontPt * 1.25);

  // First-page top-left watermark (10pt, 50% opacity)
  try{ if(typeof doc.setGState === 'function') doc.setGState({opacity:0.5}); }catch(e){}
  doc.setFontSize(10); doc.setFont(jsFont, 'normal');
  doc.text('Foxhelp Notebook', leftX, margin - 8);
  try{ if(typeof doc.setGState === 'function') doc.setGState({opacity:1}); }catch(e){}

  // Title on first page only, bold
  doc.setFont(jsFont, 'bold');
  doc.setFontSize(titleFontPt);
  const titleY = margin + 18;
  doc.text(title, leftX, titleY);
  // reset to normal for body
  doc.setFont(jsFont, 'normal');
  doc.setFontSize(bodyFontPt);

  // Start body text 24pt below the title
  const lines = doc.splitTextToSize((content || '').replace(/\t/g, '    '), usableWidth);
  let cursorY = titleY + 24;
        const maxY = pageHeight - margin - 20;
        let pageNum = 1;

        for(let i=0;i<lines.length;i++){
          if(cursorY + lineHeight > maxY){
            // page number on current page
            doc.setFontSize(10); doc.setFont(jsFont, 'normal'); doc.text(`Page ${pageNum}`, pageWidth - margin - 50, pageHeight - margin + 10);
            doc.addPage(); pageNum++;
            // position cursor near top margin on new pages (no title)
            cursorY = margin + 18;
            doc.setFontSize(bodyFontPt);
          }
          doc.text(lines[i], leftX, cursorY);
          cursorY += lineHeight;
        }

        // final page footer: page number
        doc.setFontSize(10); doc.setFont(jsFont, 'normal'); doc.text(`Page ${pageNum}`, pageWidth - margin - 50, pageHeight - margin + 10);

        // final page watermark-style counts (8pt, low opacity) centered
        const words = (content||'').trim().length ? (content||'').trim().split(/\s+/).filter(Boolean).length : 0;
        const chars = (content||'').length;
        const countsText = `${words} words — ${chars} characters`;
        try{ if(typeof doc.setGState === 'function') doc.setGState({opacity:0.28}); }catch(e){}
        doc.setFontSize(8); doc.setTextColor(0,0,0);
        doc.text(countsText, pageWidth/2, pageHeight - margin + 6, {align: 'center'});
        try{ if(typeof doc.setGState === 'function') doc.setGState({opacity:1}); }catch(e){}

        const filename = safeFileName(title) + '.pdf';
        doc.save(filename);
        status('PDF exported');
      }catch(err){ console.error(err); alert('Export failed: ' + (err && err.message)); }
    }

    // Attach to both menu option and any legacy button ids
    if(exportPdfOption) exportPdfOption.addEventListener('click', exportSinglePdf);

    if(exportPdfBtn) exportPdfBtn.addEventListener('click', exportSinglePdf);

    // Export as plain text (.txt)
    exportTxtOption && exportTxtOption.addEventListener('click', ()=>{
      exportMenu.style.display = 'none';
      const filename = safeFileName(noteTitle.value || 'note') + '.txt';
      const blob = new Blob([notepad.value || ''], {type:'text/plain;charset=utf-8'});
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      status('TXT exported');
    });

    // Export All menu (offers .txt or .pdf) and handlers
    const exportAllMenu = document.getElementById('exportAllMenu');
    const exportAllTxtOption = document.getElementById('exportAllTxtOption');
    const exportAllPdfOption = document.getElementById('exportAllPdfOption');

    }

    // Helper to create a PDF blob for a note (text-based, paginated)
    function createPdfBlobFor(title, content){
      const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 40;
  const leftX = margin + 12; // increased safety offset to avoid clipping at exact margin
  const usableW = pageW - margin*2 - 12;

    const fam = (fontFamily.value || '').toLowerCase();
    let jsFont = 'helvetica';
    if(fam.includes('courier') || fam.includes('mono')) jsFont = 'courier';
    else if(fam.includes('times') || fam.includes('serif')) jsFont = 'times';

    // Body font size (consistent across pages) and title 4pt larger
    const bodyFontPt = parseInt(fontSize.value || '12', 10) || 12;
    const titleFontPt = bodyFontPt + 4;
    const lineHeight = Math.round(bodyFontPt * 1.25);

    // First-page top-left watermark (10pt, 50% opacity)
    const drawWatermark = ()=>{
      try{ if(typeof doc.setGState === 'function') doc.setGState({opacity:0.5}); }catch(e){}
      doc.setFontSize(10); doc.setFont(jsFont, 'normal'); doc.setTextColor(0,0,0);
      doc.text('Foxhelp Notebook', leftX, margin - 8);
      try{ if(typeof doc.setGState === 'function') doc.setGState({opacity:1}); }catch(e){}
    };
    drawWatermark();

    // Title on first page only, bold
    doc.setFont(jsFont, 'bold');
    doc.setFontSize(titleFontPt);
    const titleY = margin + 18;
    doc.text(title || 'Untitled', leftX, titleY);
    // reset to normal for body
    doc.setFont(jsFont, 'normal');
    doc.setFontSize(bodyFontPt);

      const paragraphs = (content || '').split('\n');
      // start body text 24pt below the title
      let cursorY = titleY + 24;
      const countsText = (()=>{ const chars = (content||'').length; const words = (content||'').trim().length ? (content||'').trim().split(/\s+/).filter(Boolean).length : 0; return `${words} words — ${chars} characters`; })();

      for(let pi=0; pi<paragraphs.length; pi++){
        let para = paragraphs[pi] || '';
        para = para.replace(/\t/g, '    ');
        const lines = doc.splitTextToSize(para, usableW);
        for(let li=0; li<lines.length; li++){
          if(cursorY + lineHeight > pageH - margin - 12){ doc.addPage(); cursorY = margin + 18; }
          doc.setFontSize(bodyFontPt);
          doc.text(lines[li], leftX, cursorY);
          cursorY += lineHeight;
        }
        cursorY += lineHeight;
      }
  // final page watermark-style counts (8pt, low opacity) centered
  try{ if(typeof doc.setGState === 'function') doc.setGState({opacity:0.28}); }catch(e){}
  doc.setFontSize(8); doc.setTextColor(0,0,0);
  doc.text(countsText, pageW/2, pageH - margin + 6, {align:'center'});
  try{ if(typeof doc.setGState === 'function') doc.setGState({opacity:1}); }catch(e){}

      // return a Blob representing the PDF
  try{ return doc.output('blob'); }catch(e){ console.error('PDF output failed', e); return null; }
    }

    // Export All as .txt ZIP
    exportAllTxtOption && exportAllTxtOption.addEventListener('click', async ()=>{

        const zip = new JSZip();
        notes.forEach(n => {
          const fname = safeFileName(n.title || ('note-' + (n.id || Math.random().toString(36).slice(2,6)))) + '.txt';
          zip.file(fname, n.content || '');
        });
        const manifest = notes.map(n => ({ id: n.id, title: n.title, updated: n.updated }));
        zip.file('manifest.json', JSON.stringify(manifest, null, 2));

        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'foxhelp_notes_txt.zip'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);

    // Export All as .pdf ZIP (one PDF per note)

          if(pdfBlob) zip.file(fname, pdfBlob);
        }
        const manifest = notes.map(n => ({ id: n.id, title: n.title, updated: n.updated }));

        const a = document.createElement('a'); a.href = url; a.download = 'foxhelp_notes_pdf.zip'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);

    // Undo / Redo / Clear

    // Font controls
  fontFamily.addEventListener('change', ()=>{ notepad.style.fontFamily = fontFamily.value; });

  fontSize.addEventListener('change', ()=>{ notepad.style.fontSize = fontSize.value + 'pt'; });

    // Find / Replace
  // Single Find/Replace button opens the panel and focuses the find input
  findReplaceBtn && findReplaceBtn.addEventListener('click', ()=>{ findReplacePanel.style.display='block'; findInput.focus(); });
    closeFind.addEventListener('click', ()=>{ findReplacePanel.style.display='none'; });

    function findNext(){
      const q = findInput.value; if(!q) return; const text = notepad.value; lastFindIndex = text.indexOf(q, lastFindIndex+1); if(lastFindIndex === -1){ lastFindIndex = -1; alert('No more matches'); return; }
      notepad.focus(); notepad.setSelectionRange(lastFindIndex, lastFindIndex + q.length);
    }
    function replaceOne(){ if(lastFindIndex===-1) findNext(); if(lastFindIndex===-1) return; const before = notepad.value.slice(0,lastFindIndex); const after = notepad.value.slice(lastFindIndex + findInput.value.length); notepad.value = before + replaceInput.value + after; updateCount(); lastFindIndex = -1; }
    function replaceAll(){ if(!findInput.value) return; notepad.value = notepad.value.split(findInput.value).join(replaceInput.value); updateCount(); }
    doFind.addEventListener('click', findNext); doReplace.addEventListener('click', replaceOne); doReplaceAll.addEventListener('click', replaceAll);

    // Clipboard actions (graceful)
    copyBtn && copyBtn.addEventListener('click', async ()=>{ try{ await navigator.clipboard.writeText(notepad.value.substring(notepad.selectionStart, notepad.selectionEnd)); status('Copied'); }catch(e){ notepad.focus(); document.execCommand('copy'); } });
    cutBtn && cutBtn.addEventListener('click', async ()=>{ try{ const sel = notepad.value.substring(notepad.selectionStart, notepad.selectionEnd); await navigator.clipboard.writeText(sel); notepad.setRangeText('', notepad.selectionStart, notepad.selectionEnd, 'end'); updateCount(); status('Cut'); }catch(e){ notepad.focus(); document.execCommand('cut'); } });
    pasteBtn && pasteBtn.addEventListener('click', async ()=>{ try{ const txt = await navigator.clipboard.readText(); const pos = notepad.selectionStart; notepad.setRangeText(txt, pos, pos, 'end'); updateCount(); status('Pasted'); }catch(e){ notepad.focus(); document.execCommand('paste'); } });

    // Print: open a focused print window containing only the note (with watermark and counts)
    printBtn.addEventListener('click', ()=>{
      const title = (noteTitle.value || (currentId ? (notes.find(n=>n.id===currentId)||{}).title : 'Untitled')) || 'Untitled';

      const fontFam = fontFamily.value || 'serif';
      const fontSz = (fontSize.value || '15') + 'pt';
      const words = content.trim().length ? content.trim().split(/\s+/).filter(Boolean).length : 0;
      const chars = content.length;
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>Print - ${escapeHtml(title)}</title><style>body{font-family:${fontFam};font-size:${fontSz};padding:20px;color:#000} .fox-watermark{opacity:0.12;text-align:center;font-size:28px;margin-bottom:12px} pre{white-space:pre-wrap;line-height:1.35}</style></head><body><div class="fox-watermark">FoxHelp Notebook</div><h1 style="margin:6px 0 12px 0;font-size:20pt">${escapeHtml(title)}</h1><pre>${escapeHtml(content)}</pre><div style="margin-top:16px;font-size:11pt">${words} words — ${chars} characters</div></body></html>`;
      const w = window.open('', '_blank');
      if(!w){ alert('Popup blocked. Allow popups for this site to print.'); return; }
      w.document.open(); w.document.write(html); w.document.close();
      w.focus();
      setTimeout(()=>{ w.print(); w.close(); }, 300);
    });

    // Dark mode
    darkToggle.addEventListener('click', ()=>{ document.body.classList.toggle('dark'); darkToggle.textContent = document.body.classList.contains('dark') ? 'Light' : 'Dark'; });

    // Copy / paste keyboard shortcuts
    document.addEventListener('keydown',(e)=>{
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); saveNoteHandler(); }
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='p'){ e.preventDefault(); window.print(); }
      // Ctrl+F / Cmd+F opens the Find/Replace panel in-app
      if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='f'){
        // avoid stealing browser find when user also wants that — preventDefault to keep focus in app
        e.preventDefault();
        if(findReplacePanel){ findReplacePanel.style.display='block'; findInput.focus(); }
      }
    });

    // Helpers
    function escapeHtml(str){
      if(!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    }
    function status(txt){ statusEl.textContent = txt; setTimeout(()=>{ statusEl.textContent = 'Ready'; },1400); }
    function updateCount(){
      const text = notepad.value || '';
      // character count (including spaces)
      charCount.textContent = `${text.length} characters`;
      // word count: split on whitespace, filter out empty tokens
      const words = text.trim().length ? text.trim().split(/\s+/).filter(Boolean) : [];
      wordCountEl.textContent = `${words.length} word${words.length===1? '':'s'}`;
    }

    // Sidebar helpers: support different show/hide classes across breakpoints
    function showSidebar(){
      if(window.matchMedia('(max-width:600px)').matches){
        sidebar.classList.add('visible');
      }else{
        sidebar.classList.remove('hidden');
      }
    }
    function hideSidebar(){
      if(window.matchMedia('(max-width:600px)').matches){
        sidebar.classList.remove('visible');
      }else{
        sidebar.classList.add('hidden');
      }
    }

    // Insert helpers
    function insertAtCaret(el, text){
      try{
        const start = el.selectionStart || 0;
        const end = el.selectionEnd || 0;
        el.setRangeText(text, start, end, 'end');
        el.focus();
        updateCount();
        status('Inserted');
      }catch(e){ console.error(e); }
    }

    // Date/time formats
    function pad(n){ return (n<10? '0'+n : ''+n); }
    function formatDateTime(kind){ const d = new Date(); if(kind==='hh:mm:ss'){ return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds()); } if(kind==='dd/mm/yy'){ return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(-2); } if(kind==='hh:mm:ss ampm'){ const h = d.getHours(); const am = h<12?'AM':'PM'; const hh = h%12||12; return pad(hh)+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+' '+am; } if(kind==='yy/mm/dd'){ return String(d.getFullYear()).slice(-2)+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate()); } return d.toString(); }

    // Build special characters grid (from user-supplied list)
    const specialCharsStr = `⬅️ ⬆️ ➡️ ⬇️ ↩️ ↪️ ⤴️ ⤵️ ⮕ ⮔ ⮞ ⮟ ⮘ ⮙ ⮚ ⮛ ⇢ ⇠ ⇨ ⇦ ⇧ ⇩ ⤳ ⤷ ✚ ➕ ✖ ✎ ✏️ 🗑️ 💾 🔍 🔎 🔗 📎 📁 📂 🗂️ 📝 🗒️ 🗃️ 🔄 🔁 🔂 ⚙️ 🔔 🔕 ⏰ ⏱️ ⏳ 🔒 🔓 🖊️ 🖋️ ✉️ 📤 📥 ✦ ✧ ★ ☆ ✪ ✫ ✬ ✭ ✮ ✯ ❇ ❈ ❉ ❊ ❋ ✤ ✱ ✲ ✳ ✴ ✵ ✶ ✷ ✸ ✹ ✺ ☀ ☁ ☂ ☃ ❄ ❆ ☾ ☽ ⚡ ⛅ 🌙 ∝ ∠ ∟ ⊥ ∧ ∨ ∩ ∪ ∫ ∬ ∭ ∮ ∯ ∰ ∂ ∇ ∴ ∵ ≈ ≡ ≢ ≤ ≥ ≪ ≫ ∞ ⊕ ⊖ ⊗ ⊘ ⊙ ⊚ ⊛ ⊤ ⊥ ⊢ ⊣ ∀ ∃ ∄ ∈ ∉ ∋ ∌ ∅ ℵ ¼ ½ ¾ ⅓ ⅔ ⅛ ⅜ ⅝ ⅞ ¹ ² ³ ⁴ ⁵ ⁶ ⁷ ⁸ ⁹ ⁰ ₁ ₂ ₃ ₄ ₅ ₆ ₇ ₈ ₉ ₀ ▪ ▫ ◾ ◽ ◼ ◻ ⬛ ⬜ ⬤ ⭕ ◯ ⚫ ⚪ ◈ ◉ ┌ ┐ └ ┘ ─ │ ┼ ┤ ├ ┴ ┬ ╔ ╗ ╚ ╝ ═ ║ ╩ ╦ ╠ ╣ ╬ ✓ ✔ ✕ ✖ ✗ ✘ ☑ ☐ ☒ ♻ ⚠ ❗ ❕ ❓ ❔ 🚫 ⛔ ⛏ ⚒ ⚙ ⚜ ⚖ ⚗ ⚰ ⚱ ⚓ ⚑ ⚐ ⚔ 🕊️ ☮ 🙂 😊 😎 🤔 😇 😍 🤩 😢 😡 😂 🤯 🙏 💡 💬 💭 📌 📍 ✉️ 📞 ¢ £ € ¥ © ® ™ ‰ µ ¶ § † ‡ « » … • ± × ÷ = ≠ ≤ ≥ ∞ ≈ √ ∑ ∏ ∂ ∆ ∫ ∴ ∵ Á À Â Ã Ä Å Æ Ç É È Ê Ë Í Ì Î Ï Ñ Ó Ò Ô Õ Ö Ø Ú Ù Û Ü Ý Ÿ Þ Ð á à â ã ä å æ ç é è ê ë í ì î ï ñ ó ò ô õ ö ø ú ù û ü ý ÿ ð þ ß Α Β Γ Δ Ε Ζ Η Θ Ι Κ Λ Μ Ν Ξ Ο Π Ρ Σ Τ Υ Φ Χ Ψ Ω α β γ δ ε ζ η θ ι κ λ μ ν ξ ο π ρ σ τ υ φ χ ψ ω ← ↑ → ↓ ↔ ↕ ⇐ ⇒ ⇔ ⊕ ⊗ ⊂ ⊃ ⊆ ⊇ ∈ ∉ ∩ ∪ ♠ ♣ ♥ ♦ ◊ ○ • ◘ ◙ ▪ ▫ □ ■ ⌂`;
    const specialChars = specialCharsStr.split(/\s+/).filter(Boolean);
    specialChars.forEach(ch=>{
      const b = document.createElement('button'); b.className='btn small'; b.type='button'; b.textContent = ch; b.title = ch; b.addEventListener('click', ()=>{ insertAtCaret(notepad, ch); insertMenu.style.display='none'; insertMenu.setAttribute('aria-hidden','true'); }); specialGrid.appendChild(b);
    });

    // Insert menu interactions
    insertBtn && insertBtn.addEventListener('click',(e)=>{
      const rect = insertBtn.getBoundingClientRect();
      const willShow = insertMenu.style.display!=='block';
      insertMenu.style.display = willShow ? 'block' : 'none';
      insertMenu.setAttribute('aria-hidden', !willShow);
      if(willShow){
        // position below the button using viewport coordinates (fixed positioning)
        const top = rect.bottom + 6; // rect is viewport-based
        let left = rect.left - 10;
        // clamp to viewport so menu doesn't go off-screen
        const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
        const menuW = Math.min(520, vw - 16);
        if(left + menuW > vw - 8) left = vw - menuW - 8;
        if(left < 8) left = 8;
        insertMenu.style.top = top + 'px';
        insertMenu.style.left = left + 'px';

    // Date/time buttons
    insertMenu && insertMenu.querySelectorAll('[data-dt]').forEach(btn=> btn.addEventListener('click', ()=>{ const k = btn.getAttribute('data-dt'); insertAtCaret(notepad, formatDateTime(k)); insertMenu.style.display='none'; insertMenu.setAttribute('aria-hidden','true'); }));

    // Non-breaking space
    const nbspaceBtn = document.getElementById('nbspaceBtn'); nbspaceBtn && nbspaceBtn.addEventListener('click', ()=>{ insertAtCaret(notepad, '\u00A0'); insertMenu.style.display='none'; insertMenu.setAttribute('aria-hidden','true'); });

    // Close insert menu when clicking outside
    document.addEventListener('click',(e)=>{ if(!insertMenu || !insertBtn) return; if(insertMenu.style.display==='block' && !insertMenu.contains(e.target) && !insertBtn.contains(e.target)){ insertMenu.style.display='none'; insertMenu.setAttribute('aria-hidden','true'); } });

    search.addEventListener('input', ()=> renderNotes(search.value));

    // Init
    toggleSidebar.addEventListener('click', ()=>{
      if(window.matchMedia('(max-width:600px)').matches){
        sidebar.classList.toggle('visible');
      }else{
        sidebar.classList.toggle('hidden');
      }
    });
    newNote.addEventListener('click', newNoteHandler);
    saveNote.addEventListener('click', saveNoteHandler);
    // Improved delete handler: support deleting by currentId, fallback to find-by-title, or clear unsaved note
    deleteNote.addEventListener('click', ()=>{
      // If a saved note is selected, delete it
      if(currentId){
        if(confirm('Delete note?')){
          notes = notes.filter(n=>n.id!==currentId);
          saveToLocal();
          currentId = null; noteTitle.value = ''; notepad.value = ''; renderNotes(); status('Deleted');
        }
        return;
      }

      // No currentId: try to match by title in saved notes
      const title = (noteTitle.value || '').trim();
      if(title){
        const idx = notes.findIndex(n => (n.title || '') === title);
        if(idx !== -1){
          if(confirm(`Delete saved note "${title}"?`)){
            notes.splice(idx, 1);
            saveToLocal();
            currentId = null; noteTitle.value = ''; notepad.value = ''; renderNotes(); status('Deleted');
          }
          return;
        }
      }

      // Nothing matched: offer to clear the current (unsaved) note
      if((noteTitle.value && noteTitle.value.trim()) || notepad.value){
        if(confirm('No saved note selected. Clear current unsaved note?')){
          noteTitle.value = ''; notepad.value = ''; updateCount(); status('Cleared');
        }
      }
    });

    notepad.addEventListener('input', ()=>{ updateCount(); });

  // ensure font defaults applied
  notepad.style.fontFamily = fontFamily.value;
  notepad.style.fontSize = fontSize.value + 'pt';

    renderNotes();
  </script>
